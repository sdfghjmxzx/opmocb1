services:
  - type: web
    name: onepiece-multiplayer-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python multiplayer_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
